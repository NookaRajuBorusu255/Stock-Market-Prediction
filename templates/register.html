{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5">
        <div class="glow-spot" style="top: 20%; left: 40%;"></div>
        
        <div class="glass-card text-center">
            <i class="bi bi-person-plus-fill text-primary" style="font-size: 3.5rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
            <h2 class="mt-3 mb-2">Create Account</h2>
            <p class="text-secondary mb-4">Register to start predicting stock trends</p>
            
            <form action="{{ url_for('auth.register') }}" method="POST" class="text-start">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small fw-semibold">Username</label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary small fw-semibold">Email Address</label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-secondary small fw-semibold">Confirm Password</label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-gradient w-100 py-3 mb-3">
                    <i class="bi bi-person-check-fill me-2"></i>Create Account
                </button>
            </form>
            
            <p class="text-secondary small mb-0 mt-3">
                Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
