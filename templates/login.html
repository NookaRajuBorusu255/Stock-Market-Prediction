{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5">
        <div class="glow-spot" style="top: 25%; left: 35%;"></div>
        
        <div class="glass-card text-center">
            <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3.5rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
            <h2 class="mt-3 mb-2">Welcome Back</h2>
            <p class="text-secondary mb-4">Log in to manage stock analyses and forecasts</p>
            
            <form action="{{ url_for('auth.login') }}" method="POST" class="text-start">
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small fw-semibold">Username</label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
                    <div class="input-group input-group-glass">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>
                
                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input bg-transparent border-glass" id="remember" name="remember">
                        <label class="form-check-label text-secondary small" for="remember">Remember me</label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-gradient w-100 py-3 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
            
            <p class="text-secondary small mb-0 mt-3">
                Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create Account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
